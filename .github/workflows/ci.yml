name: CI

on:
  push:
    branches: [main, integration/agentgate-dashboard]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agentgate
          POSTGRES_USER: agentgate
          POSTGRES_PASSWORD: agentgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentgate -d agentgate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-but-long-enough-for-checks
      TEST_DATABASE_URL: postgresql://agentgate:agentgate@localhost:5432/agentgate
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: mypy --strict engine/
      - run: lint-imports
      - run: python manage.py check
      - run: python manage.py spectacular --file /tmp/schema.yaml --validate
      - run: |
          MFA_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" \
            python manage.py check --deploy --settings=config.settings.prod
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-but-long-enough-for-checks
          DJANGO_ALLOWED_HOSTS: example.com
          DATABASE_URL: postgresql://agentgate:agentgate@localhost:5432/agentgate
          REDIS_URL: redis://127.0.0.1:6379/0
          PAYMENT_EXECUTOR: fake
          PAYMENTS_EXECUTION_ENABLED: "false"
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  security-audit:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Scan Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - name: Audit Node.js dependencies
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=moderate

  deployment-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Create placeholder production environment
        run: |
          cp .env.production.example .env.production
          sed -i 's/replace-with-a-long-random-secret/ci-placeholder-secret-not-a-real-value/' .env.production
          sed -i 's/replace-with-a-strong-password/ci-placeholder-redis-password/' .env.production
          sed -i 's/replace-with-fernet-key/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=/' .env.production
          sed -i 's/replace-with-emergency-bypass-code/ci-placeholder-bypass/' .env.production
          sed -i 's/app.example.com/ci.example.com/g' .env.production
          sed -i 's/DOMAIN=.*/DOMAIN=ci.example.com/' .env.production

      - name: Validate Compose configuration
        run: docker compose --env-file .env.production config --quiet

      - name: Static deployment topology assertions
        run: |
          pip install --quiet pyyaml
          python3 - << 'PY'
          import yaml, sys
          d = yaml.safe_load(open("compose.yaml"))
          svcs = d["services"]
          nets = d["networks"]
          # Expected services
          assert set(svcs) == {"caddy", "web", "worker", "redis"}, f"services: {set(svcs)}"
          # Expected networks
          assert set(nets) == {"edge", "backend"}, f"networks: {set(nets)}"
          # Network membership
          assert svcs["caddy"]["networks"] == ["edge"], svcs["caddy"]["networks"]
          assert set(svcs["web"]["networks"]) == {"edge", "backend"}, svcs["web"]["networks"]
          assert svcs["worker"]["networks"] == ["backend"], svcs["worker"]["networks"]
          assert svcs["redis"]["networks"] == ["backend"], svcs["redis"]["networks"]
          # No internal: true
          for n, cfg in nets.items():
              assert not (cfg and cfg.get("internal") is True), f"{n} is internal"
          # Only Caddy publishes ports
          for name, svc in svcs.items():
              ports = svc.get("ports", [])
              if name == "caddy":
                  assert "80:80" in ports and "443:443" in ports, ports
              else:
                  assert not ports, f"{name} publishes ports: {ports}"
          # No PayPal in deployment files
          import pathlib
          for p in ["compose.yaml", "Dockerfile", ".env.production.example", "deploy/Caddyfile"]:
              lines = [ln for ln in pathlib.Path(p).read_text().splitlines() if not ln.lstrip().startswith("#")]
              txt = "\n".join(lines).lower()
              assert "paypal" not in txt, f"PayPal found in {p}"
          # Browser security headers are declared at the public edge.
          caddy = pathlib.Path("deploy/Caddyfile").read_text()
          assert "Content-Security-Policy" in caddy
          assert "default-src 'self'" in caddy
          assert "frame-ancestors 'none'" in caddy
          assert "X-Frame-Options DENY" in caddy
          assert "X-Content-Type-Options nosniff" in caddy
          assert "Access-Control-Allow-Origin" not in caddy
          print("All static deployment assertions passed.")
          PY

      - name: Compile production header probe
        run: python3 -m py_compile scripts/check_production_headers.py

      - name: Build core backend Docker image
        run: docker build -t agentgate-web:ci .

      - name: Clean up placeholder environment
        if: always()
        run: rm -f .env.production
